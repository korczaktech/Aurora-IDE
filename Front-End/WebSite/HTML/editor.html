<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d0f">
  <meta name="description" content="Aurora EDS — ambiente de desenvolvimento.">
  <title>Aurora EDS — Editor</title>
  <link rel="stylesheet" href="../CSS/editor.css">
</head>
<body>
  <header class="editor-header" aria-label="Cabeçalho do editor">
    <div class="header-start">
      <button class="icon-button menu-button" id="editor-menu-toggle" type="button"
        aria-label="Abrir ou recolher painel lateral" aria-expanded="false" title="Painel lateral">
        <svg class="menu-motion-icon" viewBox="0 0 24 24" role="img" aria-hidden="true">
          <path class="menu-line menu-line-first" d="M5 4.5V19.5"/>
          <path class="menu-line menu-line-middle" d="M12 4.5V19.5"/>
          <path class="menu-line menu-line-third" d="M19 4.5V19.5"/>
        </svg>
      </button>
    </div>

    <form class="search-area" role="search" onsubmit="return false">
      <label class="visually-hidden" for="editor-search">Pesquisar no Aurora</label>
      <div class="search-field">
        <img class="search-icon" src="../SVG/editor-search.svg" alt="">
        <input id="editor-search" type="search" placeholder="Pesquisar" autocomplete="off" spellcheck="false">
      </div>
    </form>

    <nav class="header-actions" aria-label="Ferramentas do editor">
      <button class="icon-button" type="button" aria-label="Layout" title="Layout">
        <img src="../SVG/editor-layout.svg" alt="">
      </button>
      <button class="icon-button" type="button" aria-label="Anotações" title="Anotações">
        <img src="../SVG/editor-notes.svg" alt="">
      </button>
      <button class="icon-button" type="button" aria-label="Repositórios" title="Repositórios">
        <img src="../SVG/editor-repositories.svg" alt="">
      </button>
      <button class="icon-button" type="button" aria-label="Configurações" title="Configurações">
        <img src="../SVG/editor-settings.svg" alt="">
      </button>
    </nav>
  </header>

  <main class="editor-workspace" aria-label="Área de desenvolvimento"></main>

  <script>
    const menuToggle = document.getElementById("editor-menu-toggle");
    const updateMenuScale = () => {\n      const travel = Math.max(0, window.innerWidth / 2 - 55);\n      document.documentElement.style.setProperty("--menu-scale", String(1 + travel / 14));\n    };\n    updateMenuScale();\n    window.addEventListener("resize", updateMenuScale);\n    menuToggle.addEventListener("click", () => {
      const opened = menuToggle.classList.toggle("is-open");
      menuToggle.setAttribute("aria-expanded", String(opened));
    });
  </script>
</body>
</html>
