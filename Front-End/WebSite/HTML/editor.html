<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d0f">
  <meta name="description" content="Aurora EDS — ambiente de desenvolvimento.">
  <title>Aurora EDS — Editor</title>
  <link rel="stylesheet" href="../CSS/editor.css">
</head>
<body>
  <header class="editor-header" aria-label="Cabeçalho do editor">
    <div class="header-start">
      <div class="menu-mark">
      <button class="menu-back-button" id="editor-menu-back" type="button" aria-label="Voltar ao menu" title="Voltar" disabled>
        <img src="../SVG/editor-back.svg" alt="">
      </button>
      <button class="menu-open-button" id="editor-menu-open" type="button" aria-label="Abrir ferramentas" title="Abrir ferramentas" aria-expanded="false">
        <svg class="menu-motion-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path class="menu-line menu-line-first" d="M5 4.5V19.5"/>
          <path class="menu-line menu-line-middle" d="M12 4.5V19.5"/>
          <path class="menu-line menu-line-third" d="M19 4.5V19.5"/>
        </svg>
      </button>
    </div>
    <nav class="editor-tool-rail" id="editor-tool-rail" aria-label="Ferramentas principais" aria-hidden="true">
      <button class="tool-icon" type="button" data-tool="files" aria-label="Arquivos" title="Arquivos" aria-pressed="false"><img src="../SVG/editor-files.svg" alt=""></button>
      <button class="tool-icon" type="button" data-tool="edit" aria-label="Editar" title="Editar" aria-pressed="false"><img src="../SVG/editor-edit.svg" alt=""></button>
      <button class="tool-icon" type="button" data-tool="selection" aria-label="Seleção" title="Seleção" aria-pressed="false"><img src="../SVG/editor-selection.svg" alt=""></button>
      <button class="tool-icon" type="button" data-tool="view" aria-label="Exibir" title="Exibir" aria-pressed="false"><img src="../SVG/editor-view.svg" alt=""></button>
      <button class="tool-icon" type="button" data-tool="access" aria-label="Acessar" title="Acessar" aria-pressed="false"><img src="../SVG/editor-access.svg" alt=""></button>
      <button class="tool-icon" type="button" data-tool="execute" aria-label="Executar" title="Executar" aria-pressed="false"><img src="../SVG/editor-execute.svg" alt=""></button>
      <button class="tool-icon" type="button" data-tool="terminal" aria-label="Terminal" title="Terminal" aria-pressed="false"><img src="../SVG/editor-terminal.svg" alt=""></button>
      <button class="tool-icon" type="button" data-tool="help" aria-label="Ajuda" title="Ajuda" aria-pressed="false"><img src="../SVG/editor-help.svg" alt=""></button>
    </nav>
    </div>

    <form class="search-area" role="search" onsubmit="return false">
      <label class="visually-hidden" for="editor-search">Pesquisar no Aurora</label>
      <div class="search-field">
        <img class="search-icon" src="../SVG/editor-search.svg" alt="">
        <input id="editor-search" type="search" placeholder="Pesquisar" autocomplete="off" spellcheck="false">
      </div>
    </form>

    <div class="header-actions" aria-hidden="true"></div>
  </header>

  <main class="editor-workspace" aria-label="Área de desenvolvimento">
    <aside class="file-sidebar" id="fileSidebar" aria-label="Explorador de arquivos">
      <div class="file-sidebar-heading">
        <span>EXPLORADOR</span>
        <button class="sidebar-action" id="collapseTree" type="button" aria-label="Recolher árvore" title="Recolher árvore">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5.5 8 10l5-4.5" /></svg>
        </button>
      </div>
      <div class="project-tree">
        <button class="tree-row tree-project" type="button" aria-expanded="true" data-tree-toggle="project">
          <span class="tree-chevron" aria-hidden="true">⌄</span>
          <span class="tree-folder-icon" aria-hidden="true"></span>
          <span class="tree-label">Meu projeto</span>
        </button>
        <div class="tree-children" data-tree-children="project">
          <button class="tree-row tree-folder" type="button" aria-expanded="true" data-tree-toggle="src">
            <span class="tree-chevron" aria-hidden="true">⌄</span>
            <span class="tree-folder-icon" aria-hidden="true"></span>
            <span class="tree-label">src</span>
          </button>
          <div class="tree-children tree-nested" data-tree-children="src">
            <button class="tree-row tree-file is-selected" type="button" data-tree-file="index.html">
              <span class="tree-file-icon html" aria-hidden="true">5</span><span class="tree-label">index.html</span>
            </button>
            <button class="tree-row tree-file" type="button" data-tree-file="style.css">
              <span class="tree-file-icon css" aria-hidden="true">▧</span><span class="tree-label">style.css</span>
            </button>
            <button class="tree-row tree-file" type="button" data-tree-file="script.js">
              <span class="tree-file-icon js" aria-hidden="true">JS</span><span class="tree-label">script.js</span>
            </button>
          </div>
          <button class="tree-row tree-folder" type="button" aria-expanded="false" data-tree-toggle="assets">
            <span class="tree-chevron" aria-hidden="true">›</span>
            <span class="tree-folder-icon" aria-hidden="true"></span>
            <span class="tree-label">assets</span>
          </button>
          <div class="tree-children tree-nested" data-tree-children="assets" hidden></div>
        </div>
      </div>
      <div class="file-sidebar-footer"><span class="status-dot"></span> Arquivos do projeto</div>
    </aside>
    <section class="editor-empty-area" aria-label="Área de edição"></section>
  </main>

  <script>
    (() => {
      const menuMark = document.querySelector(".menu-mark");
      const toolRail = document.getElementById("editor-tool-rail");
      const middleLine = document.querySelector(".menu-line-middle");
      const thirdLine = document.querySelector(".menu-line-third");
      const backButton = document.getElementById("editor-menu-back");
      const openButton = document.getElementById("editor-menu-open");
      const searchField = document.querySelector(".search-field");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let menuState = "button";

      function measureMenuMotion() {
        const searchRect = searchField.getBoundingClientRect();
        const svgRect = menuMark.querySelector(".menu-motion-icon").getBoundingClientRect();
        const svgScale = svgRect.width / 24;
        const firstX = svgRect.left + 5 * svgScale;
        const middleX = svgRect.left + 12 * svgScale;
        const thirdX = svgRect.left + 19 * svgScale;
        const targetX = searchRect.left + 12;
        const middleTargetX = (firstX + targetX) / 2;
        const originalLength = 15 * svgScale;
        const expandedLength = Math.max(originalLength, targetX - firstX - 1.7 * svgScale);
        const verticalSweep = 7.5 * svgScale;
        document.documentElement.style.setProperty("--menu-travel", Math.max(0, targetX - thirdX) + "px");
        document.documentElement.style.setProperty("--middle-offset", (middleTargetX - middleX) + "px");
        document.documentElement.style.setProperty("--middle-length-scale", String(expandedLength / originalLength));
        document.documentElement.style.setProperty("--middle-sweep-up", (-verticalSweep) + "px");
        document.documentElement.style.setProperty("--middle-sweep-down", verticalSweep + "px");
      }

      function setState(state) {
        menuState = state;
        const isButton = state === "button";
        const isTools = state === "tools";
        openButton.disabled = !isButton;
        openButton.setAttribute("aria-expanded", String(isTools));
        backButton.hidden = !isTools;
        backButton.disabled = !isTools;
        toolRail.classList.toggle("is-visible", isTools);
        toolRail.classList.remove("is-closing");
        toolRail.setAttribute("aria-hidden", String(!isTools));
      }

      function revealToolRail() {
        if (menuState !== "opening") return;
        menuMark.classList.remove("is-open");
        setState("tools");
      }

      function finishMenuReturn() {
        if (menuState !== "returning") return;
        menuMark.classList.remove("is-open", "is-returning");
        menuMark.classList.add("is-returned");
        setState("button");
        openButton.setAttribute("aria-label", "Abrir ferramentas");
        openButton.title = "Abrir ferramentas";
      }

      function openTools() {
        if (menuState !== "button") return;
        setState("opening");
        backButton.hidden = false;
        menuMark.classList.remove("is-returned", "is-returning", "is-open");
        void menuMark.offsetWidth;
        menuMark.classList.add("is-open");
        if (reducedMotion.matches) revealToolRail();
      }

      function returnToButton() {
        if (menuState !== "tools") return;
        menuState = "returning";
        backButton.disabled = true;
        toolRail.classList.add("is-closing");
        toolRail.setAttribute("aria-hidden", "true");
        if (reducedMotion.matches) {
          finishMenuReturn();
          return;
        }
        menuMark.classList.add("is-returning");
      }

      measureMenuMotion();
      window.addEventListener("resize", measureMenuMotion);
      openButton.addEventListener("click", openTools);
      backButton.addEventListener("click", returnToButton);

      middleLine.addEventListener("animationend", event => {
        if (event.animationName === "menu-middle-journey" && menuState === "opening") revealToolRail();
      });
      thirdLine.addEventListener("animationend", event => {
        if (event.animationName === "menu-third-travel" && menuState === "returning") finishMenuReturn();
      });
      thirdLine.addEventListener("animationcancel", () => {
        if (menuState === "returning") finishMenuReturn();
      });

      const fileSidebar = document.getElementById("fileSidebar");
      const collapseTree = document.getElementById("collapseTree");
      collapseTree.addEventListener("click", () => {
        const collapsed = fileSidebar.classList.toggle("is-collapsed");
        collapseTree.setAttribute("aria-label", collapsed ? "Expandir árvore" : "Recolher árvore");
        collapseTree.title = collapsed ? "Expandir árvore" : "Recolher árvore";
      });
      fileSidebar.addEventListener("click", event => {
        const toggle = event.target.closest("[data-tree-toggle]");
        if (toggle) {
          const key = toggle.dataset.treeToggle;
          const children = fileSidebar.querySelector(`[data-tree-children="${key}"]`);
          if (!children) return;
          const expanded = toggle.getAttribute("aria-expanded") === "true";
          toggle.setAttribute("aria-expanded", String(!expanded));
          children.hidden = expanded;
          const chevron = toggle.querySelector(".tree-chevron");
          if (chevron) chevron.textContent = expanded ? "›" : "⌄";
          return;
        }
        const file = event.target.closest("[data-tree-file]");
        if (!file) return;
        fileSidebar.querySelectorAll("[data-tree-file]").forEach(item => item.classList.toggle("is-selected", item === file));
      });

      toolRail.addEventListener("click", event => {
        const selected = event.target.closest("[data-tool]");
        if (!selected) return;
        if (selected.dataset.tool === "files") fileSidebar.classList.toggle("is-collapsed");
        toolRail.querySelectorAll("[data-tool]").forEach(button => {
          const active = button === selected;
          button.classList.toggle("is-active", active);
          button.setAttribute("aria-pressed", String(active));
        });
      });

      // Estado inicial: três linhas visíveis e clicáveis. Nenhuma animação automática.
      menuMark.classList.remove("is-open", "is-returning", "is-returned");
      setState("button");
    })();
  </script>
</body>
</html>
