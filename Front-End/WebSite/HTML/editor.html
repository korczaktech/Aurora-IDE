<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d0f">
  <meta name="description" content="Interface experimental do editor de código Aurora EDS.">
  <title>Aurora EDS — Editor experimental</title>
  <meta name="robots" content="noindex,follow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="../CSS/editor.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
  <script src="../JavaScript/auth.js"></script>
</head>
<body>
  <header class="editor-header" aria-label="Cabeçalho do editor">
    <div class="header-start">
      <div class="menu-mark">
      <button class="menu-back-button" id="editor-menu-back" type="button" aria-label="Voltar ao menu" title="Voltar" disabled>
        <img src="../SVG/editor-back.svg" alt="">
      </button>
      <button class="menu-open-button" id="editor-menu-open" type="button" aria-label="Abrir ferramentas" title="Abrir ferramentas" aria-expanded="false">
        <svg class="menu-motion-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path class="menu-line menu-line-first" d="M5 4.5V19.5"/>
          <path class="menu-line menu-line-middle" d="M12 4.5V19.5"/>
          <path class="menu-line menu-line-third" d="M19 4.5V19.5"/>
        </svg>
      </button>
    </div>
    <nav class="editor-tool-rail" id="editor-tool-rail" aria-label="Ferramentas principais" aria-hidden="true">
      <button class="tool-icon" type="button" data-tool="files" aria-label="Arquivos" title="Arquivos" aria-pressed="false"><img src="../SVG/editor-files.svg" alt=""></button>
      <button class="tool-icon" type="button" data-tool="edit" aria-label="Editar" title="Editar" aria-pressed="false"><img src="../SVG/editor-edit.svg" alt=""></button>
      <button class="tool-icon" type="button" data-tool="selection" aria-label="Seleção" title="Seleção" aria-pressed="false"><img src="../SVG/editor-selection.svg" alt=""></button>
      <button class="tool-icon" type="button" data-tool="view" aria-label="Exibir" title="Exibir" aria-pressed="false"><img src="../SVG/editor-view.svg" alt=""></button>
      <button class="tool-icon" type="button" data-tool="access" aria-label="Acessar" title="Acessar" aria-pressed="false"><img src="../SVG/editor-access.svg" alt=""></button>
      <button class="tool-icon" type="button" data-tool="execute" aria-label="Executar" title="Executar" aria-pressed="false"><img src="../SVG/editor-execute.svg" alt=""></button>
      <button class="tool-icon" type="button" data-tool="terminal" aria-label="Terminal" title="Terminal" aria-pressed="false"><img src="../SVG/editor-terminal.svg" alt=""></button>
      <button class="tool-icon" type="button" data-tool="help" aria-label="Ajuda" title="Ajuda" aria-pressed="false"><img src="../SVG/editor-help.svg" alt=""></button>
    </nav>
    </div>

    <form class="search-area" role="search" onsubmit="return false">
      <label class="visually-hidden" for="editor-search">Pesquisar no Aurora</label>
      <div class="search-field">
        <img class="search-icon" src="../SVG/editor-search.svg" alt="">
        <input id="editor-search" type="search" placeholder="Pesquisar" autocomplete="off" spellcheck="false">
      </div>
    </form>

    <div class="header-actions" aria-label="Painéis do editor">
      <button class="header-action-button" id="header-layout" type="button" data-header-action="layout" aria-label="Layout" title="Layout" aria-pressed="false"><img src="../SVG/editor-layout.svg" alt=""></button>
      <button class="header-action-button" id="header-notes" type="button" data-header-action="notes" aria-label="Anotações" title="Anotações" aria-pressed="false"><img src="../SVG/editor-notes.svg" alt=""></button>
      <button class="header-action-button" id="header-repositories" type="button" data-header-action="repositories" aria-label="Repositórios" title="Repositórios" aria-pressed="false"><img src="../SVG/editor-repositories.svg" alt=""></button>
      <button class="header-action-button" id="header-settings" type="button" data-header-action="settings" aria-label="Configurações" title="Configurações" aria-pressed="false"><img src="../SVG/editor-settings.svg" alt=""></button>
    </div>
  </header>

  <main class="editor-workspace" aria-label="Área de desenvolvimento">
    <aside class="file-sidebar" id="fileSidebar" aria-label="Explorador de arquivos">
      <div class="file-sidebar-heading">
        <span>GERENCIADOR DE PROJETOS</span>
        <button class="sidebar-action" id="collapseTree" type="button" aria-label="Recolher árvore" title="Recolher árvore">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5.5 8 10l5-4.5" /></svg>
        </button>
      </div>
      <div class="project-toolbar" aria-label="Ações do projeto">
        <button type="button" id="createProject" title="Criar projeto">Novo projeto</button>
        <button type="button" id="openProject" title="Abrir pasta">Abrir pasta</button>
      </div>
      <div class="project-toolbar project-item-toolbar" aria-label="Gerenciar arquivos e pastas">
        <button type="button" id="newProjectFile" title="Criar arquivo">+ Arquivo</button>
        <button type="button" id="newProjectFolder" title="Criar pasta">+ Pasta</button>
        <button type="button" id="renameProjectItem" title="Renomear item">Renomear</button>
        <button type="button" id="deleteProjectItem" title="Excluir item">Excluir</button>
      </div>
      <div class="project-tree" id="projectTree" role="tree" aria-label="Arquivos e diretórios do projeto"></div>
      <div class="file-sidebar-footer" aria-live="polite">
        <span class="status-dot"></span><span id="projectName">Nenhum projeto aberto</span>
        <span id="projectStatus">Crie um projeto ou abra uma pasta.</span>
        <span id="selectedProjectItem" class="visually-hidden">Raiz do projeto</span>
      </div>
    </aside>
    <section class="editor-empty-area" aria-label="Editor de código">
      <div class="code-editor-shell">
        <div class="editor-tab-strip" id="codeTabs" role="tablist" aria-label="Arquivos abertos">
          
        </div>
        <div class="editor-context-row">
          <div class="editor-breadcrumb"><span>Nenhum projeto</span><span class="breadcrumb-separator">›</span><span id="activeCodeFile">Nenhum arquivo aberto</span></div>
          <span class="editor-context-label" id="activeLanguage">—</span>
        </div>
        <div class="code-viewport" id="codeViewport">
          <div class="code-gutter" id="codeGutter" aria-hidden="true">1</div>
          <div class="code-input-wrap">
            <pre class="code-highlight" id="codeHighlight" aria-hidden="true"></pre>
            <textarea class="code-input" id="codeInput" aria-label="Código-fonte" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea>
          </div>
        </div>
        <footer class="code-statusbar">
          <div class="code-status-left"><span class="status-dot"></span><span>Pronto</span><span class="status-divider">|</span><span id="codeFileStatus">Nenhum arquivo aberto</span></div>
          <div class="code-status-right"><span id="codeCursor">Ln 1, Col 1</span><span id="codeLanguageStatus">—</span><span>UTF-8</span><span>LF</span></div>
        </footer>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script src="../JavaScript/syntax-highlighting.js"></script>
  <script src="../JavaScript/file-icons.js"></script>
  <script>
    (() => {
      const menuMark = document.querySelector(".menu-mark");
      const toolRail = document.getElementById("editor-tool-rail");
      const middleLine = document.querySelector(".menu-line-middle");
      const thirdLine = document.querySelector(".menu-line-third");
      const backButton = document.getElementById("editor-menu-back");
      const openButton = document.getElementById("editor-menu-open");
      const searchField = document.querySelector(".search-field");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let menuState = "button";

      function measureMenuMotion() {
        const searchRect = searchField.getBoundingClientRect();
        const svgRect = menuMark.querySelector(".menu-motion-icon").getBoundingClientRect();
        const svgScale = svgRect.width / 24;
        const firstX = svgRect.left + 5 * svgScale;
        const middleX = svgRect.left + 12 * svgScale;
        const thirdX = svgRect.left + 19 * svgScale;
        const targetX = searchRect.left + 12;
        const middleTargetX = (firstX + targetX) / 2;
        const originalLength = 15 * svgScale;
        const expandedLength = Math.max(originalLength, targetX - firstX - 1.7 * svgScale);
        const verticalSweep = 7.5 * svgScale;
        document.documentElement.style.setProperty("--menu-travel", Math.max(0, targetX - thirdX) + "px");
        document.documentElement.style.setProperty("--middle-offset", (middleTargetX - middleX) + "px");
        document.documentElement.style.setProperty("--middle-length-scale", String(expandedLength / originalLength));
        document.documentElement.style.setProperty("--middle-sweep-up", (-verticalSweep) + "px");
        document.documentElement.style.setProperty("--middle-sweep-down", verticalSweep + "px");
      }

      function setState(state) {
        menuState = state;
        const isButton = state === "button";
        const isTools = state === "tools";
        openButton.disabled = !isButton;
        openButton.setAttribute("aria-expanded", String(isTools));
        backButton.hidden = !isTools;
        backButton.disabled = !isTools;
        toolRail.classList.toggle("is-visible", isTools);
        toolRail.classList.remove("is-closing");
        toolRail.setAttribute("aria-hidden", String(!isTools));
      }

      function revealToolRail() {
        if (menuState !== "opening") return;
        menuMark.classList.remove("is-open");
        setState("tools");
      }

      function finishMenuReturn() {
        if (menuState !== "returning") return;
        menuMark.classList.remove("is-open", "is-returning");
        menuMark.classList.add("is-returned");
        setState("button");
        openButton.setAttribute("aria-label", "Abrir ferramentas");
        openButton.title = "Abrir ferramentas";
      }

      function openTools() {
        if (menuState !== "button") return;
        setState("opening");
        backButton.hidden = false;
        menuMark.classList.remove("is-returned", "is-returning", "is-open");
        void menuMark.offsetWidth;
        menuMark.classList.add("is-open");
        if (reducedMotion.matches) revealToolRail();
      }

      function returnToButton() {
        if (menuState !== "tools") return;
        menuState = "returning";
        backButton.disabled = true;
        toolRail.classList.add("is-closing");
        toolRail.setAttribute("aria-hidden", "true");
        if (reducedMotion.matches) {
          finishMenuReturn();
          return;
        }
        menuMark.classList.add("is-returning");
      }

      measureMenuMotion();
      window.addEventListener("resize", measureMenuMotion);
      openButton.addEventListener("click", openTools);
      backButton.addEventListener("click", returnToButton);

      middleLine.addEventListener("animationend", event => {
        if (event.animationName === "menu-middle-journey" && menuState === "opening") revealToolRail();
      });
      thirdLine.addEventListener("animationend", event => {
        if (event.animationName === "menu-third-travel" && menuState === "returning") finishMenuReturn();
      });
      thirdLine.addEventListener("animationcancel", () => {
        if (menuState === "returning") finishMenuReturn();
      });

      const codeInput = document.getElementById("codeInput");
      const codeHighlight = document.getElementById("codeHighlight");
      const codeGutter = document.getElementById("codeGutter");
      const codeTabs = document.getElementById("codeTabs");
      const codeFiles = {};
      let activeCodeFile = "index.html";
      const codeSelections = new Map();
      const escapeCode = value => String(value).replace(/[&<>]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[char]));
      function highlightCode(source, file) {
        if (window.AuroraSyntaxHighlight) return window.AuroraSyntaxHighlight.highlight(source, file);
        return escapeCode(source) + (source.endsWith("\n") ? " " : "");
      }
      let gutterMeasureNode = null;
      let gutterSyncFrame = 0;

      function syncCodeScroll() {
        if (gutterSyncFrame) cancelAnimationFrame(gutterSyncFrame);
        gutterSyncFrame = requestAnimationFrame(() => {
          gutterSyncFrame = 0;
          codeHighlight.scrollTop = codeInput.scrollTop;
          codeHighlight.scrollLeft = codeInput.scrollLeft;
          codeGutter.scrollTop = codeInput.scrollTop;
          codeGutter.scrollLeft = 0;
        });
      }

      function measureVisualLineHeights(lines) {
        const style = getComputedStyle(codeInput);
        const lineHeight = Number.parseFloat(style.lineHeight) || 22;
        const wrapping = style.whiteSpace.includes("wrap");
        if (!wrapping) return lines.map(() => lineHeight);

        if (!gutterMeasureNode) {
          gutterMeasureNode = document.createElement("div");
          gutterMeasureNode.setAttribute("aria-hidden", "true");
          Object.assign(gutterMeasureNode.style, {
            position: "fixed", left: "-100000px", top: "0", visibility: "hidden",
            pointerEvents: "none", margin: "0", border: "0", padding: "0",
            boxSizing: "content-box", height: "auto", overflow: "visible"
          });
          document.body.appendChild(gutterMeasureNode);
        }

        const contentWidth = Math.max(1, codeInput.clientWidth
          - (Number.parseFloat(style.paddingLeft) || 0)
          - (Number.parseFloat(style.paddingRight) || 0));
        Object.assign(gutterMeasureNode.style, {
          width: contentWidth + "px",
          fontFamily: style.fontFamily,
          fontSize: style.fontSize,
          fontWeight: style.fontWeight,
          fontStyle: style.fontStyle,
          lineHeight: style.lineHeight,
          letterSpacing: style.letterSpacing,
          tabSize: style.tabSize,
          whiteSpace: "pre-wrap",
          overflowWrap: style.overflowWrap,
          wordBreak: style.wordBreak
        });

        const fragment = document.createDocumentFragment();
        lines.forEach(line => {
          const measureLine = document.createElement("div");
          Object.assign(measureLine.style, {
            display: "block", minHeight: lineHeight + "px",
            margin: "0", padding: "0", border: "0",
            font: style.font, lineHeight: style.lineHeight,
            letterSpacing: style.letterSpacing,
            whiteSpace: "pre-wrap", overflowWrap: style.overflowWrap,
            wordBreak: style.wordBreak, tabSize: style.tabSize
          });
          measureLine.textContent = line || " ";
          fragment.appendChild(measureLine);
        });
        gutterMeasureNode.replaceChildren(fragment);
        const heights = Array.from(gutterMeasureNode.children, node =>
          Math.max(lineHeight, node.getBoundingClientRect().height)
        );
        gutterMeasureNode.replaceChildren();
        return heights;
      }

      function updateCodeSurface() {
        const source = codeInput.value;
        codeHighlight.innerHTML = highlightCode(source, activeCodeFile);

        const lines = source.split(/\r\n|\r|\n/);
        const heights = measureVisualLineHeights(lines);
        const lineNumbers = document.createDocumentFragment();
        heights.forEach((height, index) => {
          const lineNumber = document.createElement("span");
          lineNumber.className = "code-gutter-line";
          lineNumber.textContent = String(index + 1);
          lineNumber.style.height = height + "px";
          lineNumber.style.minHeight = height + "px";
          lineNumber.style.flex = "0 0 " + height + "px";
          lineNumbers.appendChild(lineNumber);
        });
        codeGutter.replaceChildren(lineNumbers);
        document.getElementById("codeFileStatus").textContent = activeCodeFile;
        updateCodeCursor();
        syncCodeScroll();
      }
      function updateCodeCursor() {
        const before = codeInput.value.slice(0, codeInput.selectionStart);
        const lines = before.split(/\r\n|\r|\n/);
        const position = `Ln ${lines.length}, Col ${lines[lines.length - 1].length + 1}`;
        document.getElementById("codeCursor").textContent = position;
      }
      const openCodeFiles = new Set();
      function iconForFile(name) {
        return window.AuroraFileIcons
          ? window.AuroraFileIcons.svgForFile(name)
          : '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 3h9l5 5v13H5z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
      }
      function renderCodeTabs() {
        codeTabs.replaceChildren();
        openCodeFiles.forEach(name => {
          const tab = document.createElement("div");
          tab.className = "code-tab" + (name === activeCodeFile ? " is-active" : "");
          tab.dataset.codeFile = name;
          tab.setAttribute("role", "presentation");
          const select = document.createElement("button");
          select.type = "button";
          select.className = "code-tab-select";
          select.setAttribute("role", "tab");
          select.setAttribute("aria-selected", String(name === activeCodeFile));
          select.setAttribute("aria-label", "Abrir " + name);
          const icon = document.createElement("span");
          icon.className = "code-tab-icon";
          icon.innerHTML = iconForFile(name);
          const label = document.createElement("span");
          label.className = "code-tab-name";
          label.textContent = name;
          select.append(icon, label);
          const close = document.createElement("button");
          close.type = "button";
          close.className = "tab-close";
          close.dataset.closeCodeFile = name;
          close.setAttribute("aria-label", "Fechar " + name);
          close.title = "Fechar";
          close.textContent = "×";
          tab.append(select, close);
          codeTabs.append(tab);
        });
      }
      function closeCodeFile(name) {
        if (!openCodeFiles.has(name)) return;
        const ordered = [...openCodeFiles];
        const index = ordered.indexOf(name);
        openCodeFiles.delete(name);
        if (name === activeCodeFile) {
          const next = ordered[index + 1] || ordered[index - 1];
          if (next) {
            renderCodeTabs();
            openCodeFile(next);
          } else {
            activeCodeFile = "";
            codeInput.value = "";
            codeInput.setSelectionRange(0, 0);
            document.getElementById("activeCodeFile").textContent = "Nenhum arquivo aberto";
            document.getElementById("activeLanguage").textContent = "—";
            document.getElementById("codeLanguageStatus").textContent = "—";
            document.querySelectorAll("[data-tree-file]").forEach(file => file.classList.remove("is-selected"));
            renderCodeTabs();
            updateCodeSurface();
          }
        } else {
          renderCodeTabs();
        }
      }
      function openCodeFile(name) {
        if (!(name in codeFiles)) return;
        window.AuroraEditorIntelligence?.hideAutocomplete();
        if (activeCodeFile && activeCodeFile !== name) {
          codeSelections.set(activeCodeFile, {
            start: codeInput.selectionStart, end: codeInput.selectionEnd,
            direction: codeInput.selectionDirection, scrollTop: codeInput.scrollTop, scrollLeft: codeInput.scrollLeft
          });
        }
        openCodeFiles.add(name);
        activeCodeFile = name;
        codeInput.value = codeFiles[name];
        const savedSelection = codeSelections.get(name);
        if (savedSelection) {
          const length = codeInput.value.length;
          codeInput.setSelectionRange(Math.min(savedSelection.start, length), Math.min(savedSelection.end, length), savedSelection.direction);
          codeInput.scrollTop = savedSelection.scrollTop;
          codeInput.scrollLeft = savedSelection.scrollLeft;
        } else {
          codeInput.setSelectionRange(0, 0);
          codeInput.scrollTop = 0;
          codeInput.scrollLeft = 0;
        }
        const language = window.AuroraSyntaxHighlight ? window.AuroraSyntaxHighlight.labelFor(name) : (name.endsWith(".html") ? "HTML" : name.endsWith(".css") ? "CSS" : "JAVASCRIPT");
        document.getElementById("activeCodeFile").textContent = name;
        document.getElementById("activeLanguage").textContent = language;
        document.getElementById("codeLanguageStatus").textContent = language;
        document.querySelectorAll("[data-tree-file]").forEach(file => file.classList.toggle("is-selected", file.dataset.treeFile === name));
        renderCodeTabs();
        updateCodeSurface();
      }
      codeTabs.addEventListener("click", event => {
        const close = event.target.closest("[data-close-code-file]");
        if (close) {
          event.preventDefault();
          event.stopPropagation();
          closeCodeFile(close.dataset.closeCodeFile);
          return;
        }
        const tab = event.target.closest("[data-code-file]");
        if (tab) openCodeFile(tab.dataset.codeFile);
      });
      codeTabs.addEventListener("keydown", event => {
        const close = event.target.closest("[data-close-code-file]");
        if (close && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          closeCodeFile(close.dataset.closeCodeFile);
        }
      });
      codeInput.addEventListener("input", () => {
        if (activeCodeFile) {
          codeFiles[activeCodeFile] = codeInput.value;
          window.dispatchEvent(new CustomEvent("aurora:editor-change", {
            detail: { path: activeCodeFile, content: codeInput.value }
          }));
        }
        updateCodeSurface();
      });
      codeInput.addEventListener("scroll", syncCodeScroll, { passive: true });
      const codeResizeObserver = new ResizeObserver(() => {
        updateCodeSurface();
        syncCodeScroll();
      });
      codeResizeObserver.observe(codeInput);
      window.addEventListener("resize", syncCodeScroll, { passive: true });
      ["click", "keyup", "select"].forEach(type => codeInput.addEventListener(type, updateCodeCursor));
      codeInput.addEventListener("keydown", event => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "w") {
          event.preventDefault();
          closeCodeFile(activeCodeFile);
          return;
        }
      });
      const fileSidebar = document.getElementById("fileSidebar");
      const collapseTree = document.getElementById("collapseTree");
      collapseTree.addEventListener("click", () => {
        const collapsed = fileSidebar.classList.toggle("is-collapsed");
        collapseTree.setAttribute("aria-label", collapsed ? "Expandir árvore" : "Recolher árvore");
        collapseTree.title = collapsed ? "Expandir árvore" : "Recolher árvore";
      });
      fileSidebar.addEventListener("click", event => {
        const toggle = event.target.closest("[data-tree-toggle]");
        if (toggle) {
          const key = toggle.dataset.treeToggle;
          const children = fileSidebar.querySelector(`[data-tree-children="${key}"]`);
          if (!children) return;
          const expanded = toggle.getAttribute("aria-expanded") === "true";
          toggle.setAttribute("aria-expanded", String(!expanded));
          children.hidden = expanded;
          const chevron = toggle.querySelector(".tree-chevron");
          if (chevron) chevron.textContent = expanded ? "›" : "⌄";
          return;
        }
        const file = event.target.closest("[data-tree-file]");
        if (!file) return;
        const fileName = file.dataset.treeFile;
        if (fileName && fileName in codeFiles) openCodeFile(fileName);
        fileSidebar.querySelectorAll("[data-tree-file]").forEach(item => item.classList.toggle("is-selected", item === file));
      });

      toolRail.addEventListener("click", event => {
        const selected = event.target.closest("[data-tool]");
        if (!selected) return;
        if (selected.dataset.tool === "files") fileSidebar.classList.toggle("is-collapsed");
        toolRail.querySelectorAll("[data-tool]").forEach(button => {
          const active = button === selected;
          button.classList.toggle("is-active", active);
          button.setAttribute("aria-pressed", String(active));
        });
      });

      const validEditorPath = name => typeof name === "string" && name.length > 0 &&
        !name.startsWith("/") && !name.includes("\\") &&
        name.split("/").every(part =>
          part && part !== "." && part !== ".." && !part.includes("\0") &&
          !/[<>:"|?*]/.test(part) && !/[. ]$/.test(part));
      window.AuroraEditor = {
        get files() { return { ...codeFiles }; },
        get activeFile() { return activeCodeFile; },
        get openFiles() { return [...openCodeFiles]; },
        closeFile: closeCodeFile,
        get textarea() { return codeInput; },
        openFile: openCodeFile,
        addFile(name, content = "") {
          if (!validEditorPath(name) || Object.prototype.hasOwnProperty.call(codeFiles, name)) return false;
          codeFiles[name] = String(content);
          openCodeFile(name);
          return true;
        },
        renameFile(oldName, newName) {
          if (!validEditorPath(newName) || !Object.prototype.hasOwnProperty.call(codeFiles, oldName) ||
              (oldName !== newName && Object.prototype.hasOwnProperty.call(codeFiles, newName))) return false;
          const renamed = {};
          Object.entries(codeFiles).forEach(([name, content]) => { renamed[name === oldName ? newName : name] = content; });
          Object.keys(codeFiles).forEach(name => delete codeFiles[name]);
          Object.assign(codeFiles, renamed);
          if (openCodeFiles.has(oldName)) {
            const next = new Set([...openCodeFiles].map(name => name === oldName ? newName : name));
            openCodeFiles.clear();
            next.forEach(name => openCodeFiles.add(name));
          }
          if (codeSelections.has(oldName)) {
            codeSelections.set(newName, codeSelections.get(oldName));
            codeSelections.delete(oldName);
          }
          if (activeCodeFile === oldName) {
            activeCodeFile = newName;
            document.getElementById("activeCodeFile").textContent = newName;
            document.getElementById("codeFileStatus").textContent = newName;
            const language = window.AuroraSyntaxHighlight ? window.AuroraSyntaxHighlight.labelFor(newName) : "TEXT";
            document.getElementById("activeLanguage").textContent = language;
            document.getElementById("codeLanguageStatus").textContent = language;
            renderCodeTabs();
            updateCodeSurface();
          } else renderCodeTabs();
          return true;
        },
        deleteFile(name) {
          if (!Object.prototype.hasOwnProperty.call(codeFiles, name)) return false;
          delete codeFiles[name];
          codeSelections.delete(name);
          if (openCodeFiles.has(name)) closeCodeFile(name);
          return true;
        },
        replaceProject(files, projectName, activeName, openNames = [], preserveState = false) {
          Object.keys(codeFiles).forEach(name => delete codeFiles[name]);
          Object.entries(files || {}).forEach(([name, content]) => {
            if (typeof content === "string" && validEditorPath(name)) codeFiles[name] = content;
          });
          if (preserveState && activeCodeFile) {
            codeSelections.set(activeCodeFile, {
              start: codeInput.selectionStart, end: codeInput.selectionEnd,
              direction: codeInput.selectionDirection, scrollTop: codeInput.scrollTop, scrollLeft: codeInput.scrollLeft
            });
          } else codeSelections.clear();
          openCodeFiles.clear();
          activeCodeFile = "";
          if (activeName && Object.prototype.hasOwnProperty.call(codeFiles, activeName)) {
            openCodeFile(activeName);
            (Array.isArray(openNames) ? openNames : []).forEach(name => {
              if (name !== activeName && Object.prototype.hasOwnProperty.call(codeFiles, name)) openCodeFiles.add(name);
            });
            renderCodeTabs();
          } else {
            codeInput.value = "";
            codeInput.setSelectionRange(0, 0);
            renderCodeTabs();
            updateCodeSurface();
            document.getElementById("activeCodeFile").textContent = "Nenhum arquivo aberto";
            document.getElementById("activeLanguage").textContent = "—";
            document.getElementById("codeLanguageStatus").textContent = "—";
          }
          const projectLabel = document.querySelector(".editor-breadcrumb > span:first-child");
          if (projectLabel) projectLabel.textContent = projectName || "Projeto";
        },
        setFiles(files, activeName) {
          Object.entries(files || {}).forEach(([name, content]) => {
            if (typeof content === "string" && validEditorPath(name)) codeFiles[name] = content;
          });
          const target = activeName && Object.prototype.hasOwnProperty.call(codeFiles, activeName) ? activeName : activeCodeFile;
          if (target) openCodeFile(target);
        }
      };

      renderCodeTabs();
      updateCodeSurface();
      document.getElementById("activeCodeFile").textContent = "Nenhum arquivo aberto";
      document.getElementById("activeLanguage").textContent = "—";
      document.getElementById("codeLanguageStatus").textContent = "—";

      // Estado inicial: nenhum projeto fictício; o editor aguarda uma pasta real.
      menuMark.classList.remove("is-open", "is-returning", "is-returned");
      setState("button");
    })();
  </script>
