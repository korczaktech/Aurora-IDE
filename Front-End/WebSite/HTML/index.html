<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050708">
  <meta name="description" content="Aurora — Sua Estação de Desenvolvimento de Sistemas.">
  <title>Aurora EDS — Início</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/home.css">
</head>
<body>
  <div class="aurora-app">
    <header class="top-header">
      <a class="wordmark" href="./index.html" aria-label="Aurora EDS início"><span class="wordmark-name">Aurora</span><span class="wordmark-point">.</span><span class="wordmark-category">EDS</span></a>
      <div class="header-actions">
        <a class="header-link" href="#entrar" id="loginLink">Entrar</a>
        <a class="create-account" href="#criar-conta" id="createLink">Criar Conta</a>
        <div class="account-area" id="accountArea" hidden>
          <span class="account-name" id="accountName"></span>
          <button class="account-avatar" id="accountAvatar" aria-label="Perfil da conta"><span id="avatarInitial">A</span></button>
        </div>
      </div>
    </header>

    <div class="workspace">
      <aside class="left-rail" id="leftRail" aria-label="Navegação principal">
        <button class="rail-toggle" id="railToggle" aria-label="Recolher barra lateral" aria-expanded="true" title="Recolher barra lateral">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg>
        </button>
        <nav class="rail-nav" aria-label="Seções do Aurora">
          <button class="rail-item is-active" type="button" aria-label="Início" title="Início">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10.5 8.5-7 8.5 7"/><path d="M5.5 9.2V20h5v-6h3v6h5V9.2"/></svg><span>Início</span>
          </button>
          <button class="rail-item" type="button" aria-label="Projetos" title="Projetos">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8.8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3.5 10h17"/></svg><span>Projetos</span>
          </button>
          <button class="rail-item" type="button" aria-label="Mentoria" title="Mentoria">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2a3.1 3.1 0 0 1 0 5.9M17 14.1a5 5 0 0 1 3.5 4.8"/><path d="m15.5 8 1.2 1.2L19 6.8"/></svg><span>Mentoria</span>
          </button>
          <button class="rail-item" type="button" aria-label="Anotações" title="Anotações">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h9l3 3V20a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V5.5a2 2 0 0 1 2-2Z"/><path d="M14.5 3.8V7h3.2M8 11h8M8 14.5h8M8 18h5"/></svg><span>Anotações</span>
          </button>
          <button class="rail-item" type="button" aria-label="Extensões" title="Extensões">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3.5h3a2 2 0 0 1 2 2v2h3a2 2 0 0 1 2 2v3h-2a2 2 0 1 0 0 4h2v1.5a2 2 0 0 1-2 2h-3v-2a2 2 0 1 0-4 0v2H7a2 2 0 0 1-2-2v-3H3a2 2 0 1 1 0-4h2V7.5a2 2 0 0 1 2-2h2z"/></svg><span>Extensões</span>
          </button>
          <button class="rail-item" type="button" aria-label="Repositórios" title="Repositórios">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M6 7v5a4 4 0 0 0 4 4h6M18 7v10"/></svg><span>Repositórios</span>
          </button>
          <button class="rail-item" type="button" aria-label="Aparência" title="Aparência">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1.2a2 2 0 0 0 1.4-3.4 1.8 1.8 0 0 1 1.3-3.1H18a3 3 0 0 0 3-3C21 6.8 17 3 12 3Z"/><circle cx="7.5" cy="10" r="1"/><circle cx="11" cy="6.8" r="1"/><circle cx="16" cy="8" r="1"/></svg><span>Aparência</span>
          </button>
          <button class="rail-item" type="button" aria-label="Atividade" title="Atividade">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.2-6 4.2 12 2.2-6H21"/><path d="M12 3v2M12 19v2"/></svg><span>Atividade</span>
          </button>
          <button class="rail-item" type="button" aria-label="Sobre o Aurora" title="Sobre o Aurora">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.6 2.6 0 1 1 4.6 1.7c-1.1 1.1-2.1 1.4-2.1 3"/><path d="M12 17.5v.1"/></svg><span>Sobre o Aurora</span>
          </button>
          <button class="rail-item" type="button" aria-label="Configurações" title="Configurações">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.8a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4Z"/><path d="m19.1 13.8 1.2.9-1.5 2.6-1.4-.6a7.6 7.6 0 0 1-1.7 1l-.2 1.5h-3l-.3-1.5a7.6 7.6 0 0 1-1.7-1l-1.4.6-1.5-2.6 1.2-.9a7.2 7.2 0 0 1 0-2l-1.2-.9 1.5-2.6 1.4.6a7.6 7.6 0 0 1 1.7-1l.3-1.5h3l.2 1.5a7.6 7.6 0 0 1 1.7 1l1.4-.6 1.5 2.6-1.2.9a7.2 7.2 0 0 1 0 2Z"/></svg><span>Configurações</span>
          </button>
        </nav>
        <div class="rail-bottom"><span class="rail-version">A / 01</span></div>
      </aside>
      <button class="rail-reopen" id="railReopen" aria-label="Expandir barra lateral" title="Expandir barra lateral"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 5 7 7-7 7"/></svg></button>

      <main class="home-main">
        <div class="main-atmosphere" aria-hidden="true">
          <span class="star star-a"></span><span class="star star-b"></span><span class="star star-c"></span><span class="star star-d"></span><span class="star star-e"></span><span class="star star-f"></span>
          <div class="aurora-ribbon ribbon-one"></div><div class="aurora-ribbon ribbon-two"></div><div class="aurora-ribbon ribbon-three"></div>
        </div>
        <section class="welcome-block">
          <div class="welcome-kicker"><span></span> SUA ESTAÇÃO DE DESENVOLVIMENTO DE SISTEMAS</div>
          <h1>Onde suas ideias<br><em>ganham forma.</em></h1>
          <p>Um espaço para criar, explorar e transformar possibilidades em projetos.</p>
          <a class="learn-button" href="https://site.korczaktech.com.br/#/mentoria">Quero aprender a programar <span aria-hidden="true">↗</span></a>
        </section>
        <div class="bottom-signature"><span class="signature-mark">✳</span><span>CONSTRUA NO SEU PRÓPRIO RITMO</span><span class="signature-line"></span><span class="signature-code">AURORA / 001</span></div>
      </main>

      <aside class="projects-sidebar" aria-label="Projetos">
        <div class="projects-heading"><h2>Projetos</h2><span class="project-count">01</span></div>
        <button class="project-entry" type="button" aria-label="Projeto Aurora Playground">
          <span class="project-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.8 8.2 4.6v9.2L12 21.2l-8.2-4.6V7.4z"/><path d="m8 9 4 7 4-7M8.8 14h6.4"/></svg></span>
          <span class="project-copy"><strong>Aurora Playground</strong><span class="project-tag"><i></i> EXPERIMENTO</span></span>
        </button>
        <div class="projects-foot"><span class="projects-foot-dot"></span> SEUS PROJETOS</div>
      </aside>
    </div>
  </div>
  <script src="JavaScript/home.js"></script>
</body>
</html>
