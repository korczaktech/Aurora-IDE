<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050708">
  <meta name="description" content="Entre na sua conta Aurora EDS.">
  <title>Aurora EDS — Entrar</title>
  <meta name="robots" content="noindex,follow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/auth.css">
  <script src="../JavaScript/auth.js"></script>
</head>
<body>
  <div class="auth-app">
    <header class="auth-header">
      <a class="auth-brand" href="index.html">Aurora<span>.</span><small>EDS</small></a>
      <a class="auth-back" href="index.html">Voltar ao início</a>
    </header>
    <main class="auth-main">
      <div class="auth-kicker"><i></i> SUA ESTAÇÃO DE DESENVOLVIMENTO</div>
      <h1>Bom ter você<br><span>de volta.</span></h1>
      <p class="auth-description">Entre na sua conta para continuar de onde seus projetos pararam.</p>
      <form class="auth-form" id="login-form">
        <label class="auth-field">E-mail<input type="email" name="email" placeholder="voce@exemplo.com" autocomplete="email"></label>
        <label class="auth-field">Senha<input type="password" name="password" placeholder="Digite sua senha" autocomplete="current-password"></label>
        <div class="auth-form-meta"><label class="auth-check"><input type="checkbox" name="remember"> Manter conectado</label><a href="#">Esqueci minha senha</a></div>
        <button class="auth-submit" type="submit">Entrar</button>
      </form>
      <p class="auth-switch">Ainda não tem uma conta? <a href="criar-conta.html">Criar conta</a></p>
    </main>
  </div>
</body>
</html>
