<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aurora Python Runtime Smoke Test</title>
  <!-- Regression test for Python streams, terminal-backed asynchronous input, non-blocking time.sleep(), escaped newlines, and workspace synchronization. -->
  <script src="../terminal-python-runtime.js"></script>
  <script src="../terminal.js"></script>
</head>
<body>
  <pre id="result">Aguardando runtime Python…</pre>
  <script>
    function makeFile(name, initial = "") {
      let bytes = new TextEncoder().encode(initial);
      return {
        name, kind: "file",
        async getFile() {
          const copy = bytes.slice();
          return { name, size: copy.length, arrayBuffer: async () => copy.buffer, text: async () => new TextDecoder().decode(copy) };
        },
        async createWritable() {
          return {
            async write(value) {
              bytes = typeof value === "string" ? new TextEncoder().encode(value) :
                value instanceof ArrayBuffer ? new Uint8Array(value) : new Uint8Array(value);
            },
            async close() {}
          };
        }
      };
    }
    function makeDirectory(name) {
      const children = new Map();
      return {
        name, kind: "directory",
        async queryPermission() { return "granted"; },
        async requestPermission() { return "granted"; },
        async *entries() { for (const entry of children) yield entry; },
        async getDirectoryHandle(child, options = {}) {
          let item = children.get(child);
          if (!item && options.create) { item = makeDirectory(child); children.set(child, item); }
          if (!item || item.kind !== "directory") { const error = new Error("Directory not found"); error.name = "NotFoundError"; throw error; }
          return item;
        },
        async getFileHandle(child, options = {}) {
          let item = children.get(child);
          if (!item && options.create) { item = makeFile(child); children.set(child, item); }
          if (!item || item.kind !== "file") { const error = new Error("File not found"); error.name = "NotFoundError"; throw error; }
          return item;
        },
        async removeEntry(child) { children.delete(child); }
      };
    }
    window.addEventListener("load", async () => {
      const root = makeDirectory("python-smoke");
      const output = [];
      const inputValues = ["Raphael", "42"];
      try {
        const result = await window.AuroraPythonRuntime.run({}, [
          "from dataclasses import dataclass",
          "from pathlib import Path",
          "import asyncio, json, sqlite3, ssl, lzma",
          "import numpy as np",
          "def ask_name():",
          "    return input('Nome: ')",
          "def ask_again():",
          "    return ask_name()",
          "name = ask_again()",
          "answer = int(input('Número: '))",
          "newline = 'linha1\\nlinha2'",
          "assert name == 'Raphael' and answer == 42",
          "assert newline == 'linha1\\nlinha2'",
          "import time as clock",
          "from time import sleep as pause",
          "sleep_started = clock.perf_counter()",
          "clock.sleep(0.03)",
          "assert clock.perf_counter() - sleep_started >= 0.02",
          "def wait_inside_function():",
          "    pause(0.02)",
          "    return 'AURORA_SLEEP_FUNCTION_OK'",
          "sleep_function_result = wait_inside_function()",
          "assert sleep_function_result == 'AURORA_SLEEP_FUNCTION_OK'",
          "def decorate(fn):",
          "    def wrapped(*args, **kwargs): return fn(*args, **kwargs)",
          "    return wrapped",
          "@decorate",
          "def square(value): return value * value",
          "@dataclass",
          "class Sample:",
          "    value: int",
          "def generated():",
          "    yield from (1, 2, 3)",
          "async def async_value(): return 42",
          "assert square(6) == 36",
          "assert list(generated()) == [1, 2, 3]",
          "assert Sample(7).value == 7",
          "assert await async_value() == 42",
          "assert np.array([1, 2, 3]).sum() == 6",
          "db = sqlite3.connect(':memory:')",
          "db.execute('create table sample (value integer)')",
          "db.execute('insert into sample values (42)')",
          "assert db.execute('select value from sample').fetchone()[0] == 42",
          "assert ssl.OPENSSL_VERSION",
          "assert lzma.decompress(lzma.compress(b'aurora')) == b'aurora'",
          "assert json.loads(json.dumps({'ok': True}))['ok'] is True",
          "assert Path('/workspace').exists()",
          "print('AURORA_PYTHON_READY')",
          "print('AURORA_LANGUAGE_FEATURES_OK')",
          "print('AURORA_NUMPY_OK')",
          "print('AURORA_INPUT_OK')",
          "print('AURORA_NEWLINE_OK')",
          "print('AURORA_TIME_SLEEP_OK')",
          "print('AURORA_PRINT_LINE_1\\nAURORA_PRINT_LINE_2')",
          "with open('python-smoke.txt', 'w') as file:",
          "    file.write('AURORA_FILE_SYNC_OK')"
        ].join("\n"), {
          rootHandle: root, cwd: "",
          onOutput: chunk => output.push(String(chunk)),
          onInput: async prompt => { output.push(String(prompt)); return inputValues.shift() ?? null; }
        });
        const file = await (await root.getFileHandle("python-smoke.txt")).getFile();
        const contents = await file.text();
        const printed = output.join("");
        const passed = result.code === 0 && printed.includes("AURORA_PYTHON_READY") && printed.includes("AURORA_LANGUAGE_FEATURES_OK") && printed.includes("AURORA_NUMPY_OK") && printed.includes("AURORA_INPUT_OK") && printed.includes("AURORA_NEWLINE_OK") && printed.includes("AURORA_TIME_SLEEP_OK") && printed.includes("AURORA_PRINT_LINE_1\nAURORA_PRINT_LINE_2\n") && inputValues.length === 0 && contents === "AURORA_FILE_SYNC_OK" && result.sync.written === 1;
        document.body.dataset.pythonSmoke = passed ? "running" : "failed";
        document.body.dataset.terminalInputSmoke = "running";
        document.getElementById("result").textContent = passed
          ? "Python execution and project file synchronization passed."
          : JSON.stringify({ result, printed, contents });
        if (!passed) throw new Error("Base Python runtime smoke failed.");
        const escapedTokens = window.AuroraTerminalInternals.tokenize("python -c \"print('linha1\\nlinha2')\"");
        if (escapedTokens.length !== 3 || !escapedTokens[2].includes("\\n")) {
          throw new Error("O terminal alterou a sequência de escape \\\\n antes de entregá-la ao Python: " + JSON.stringify(escapedTokens));
        }
        const terminalFile = await root.getFileHandle("terminal-input-smoke.py", { create: true });
        const terminalWriter = await terminalFile.createWritable();
        await terminalWriter.write([
          "name = input('Nome: ')",
          "age = int(input('Idade: '))",
          "print('AURORA_TERMINAL_INPUT_OK:' + name + ':' + str(age))"
        ].join("\n") + "\n");
        await terminalWriter.close();
        window.AuroraProjectManager = {
          rootHandle: root, projectName: "python-smoke",
          flush: async () => {}, refresh: async () => {}
        };
        window.prompt = () => { throw new Error("O runtime não deve abrir prompt nativo."); };
        class FakeTerminal {
          static instances = [];
          constructor() { this.output = ""; FakeTerminal.instances.push(this); }
          loadAddon() {}
          open() {}
          onData(callback) { this.handleData = callback; }
          focus() {}
          clear() { this.output = ""; }
          dispose() {}
          write(value) {
            const chunk = String(value);
            this.output += chunk;
            if (chunk.includes("Nome: ")) queueMicrotask(() => this.handleData?.("Raphael\r"));
            if (chunk.includes("Idade: ")) queueMicrotask(() => this.handleData?.("42\r"));
            if (this.output.includes("AURORA_TERMINAL_INPUT_OK:Raphael:42")) {
              document.body.dataset.terminalInputSmoke = "passed";
              window.__auroraTerminalSmokeResolve?.();
            }
          }
        }
        window.Terminal = FakeTerminal;
        window.FitAddon = { FitAddon: class { fit() {} } };
        const terminalContainer = document.createElement("div");
        document.body.append(terminalContainer);
        window.AuroraTerminal.mount(terminalContainer);
        const terminalInstance = FakeTerminal.instances[0];
        const terminalDone = new Promise((resolve, reject) => {
          window.__auroraTerminalSmokeResolve = resolve;
          setTimeout(() => reject(new Error("Tempo limite: input() não foi concluído pelo terminal.")), 60000);
        });
        terminalInstance.handleData("python terminal-input-smoke.py");
        terminalInstance.handleData("\r");
        await terminalDone;
        document.body.dataset.pythonSmoke = "passed";
        document.getElementById("result").textContent = "Python runtime, terminal input(), escaped newlines, stdout e sincronização do projeto passaram.";

      } catch (error) {
        document.body.dataset.pythonSmoke = "failed";
        document.body.dataset.terminalInputSmoke = "failed";
        document.getElementById("result").textContent = error?.stack || String(error);
      }
    });
  </script>
</body>
</html>
