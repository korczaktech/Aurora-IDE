name: Deploy Aurora Website

on:
  push:
    branches:
      - main
    paths:
      - "Front-End/WebSite/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect website entry point
        id: detect
        shell: bash
        run: |
          ROOT="Front-End/WebSite"
          if [ -f "$ROOT/React/package.json" ]; then
            echo "mode=react" >> "$GITHUB_OUTPUT"
          elif [ -f "$ROOT/HTML/index.html" ]; then
            echo "mode=static" >> "$GITHUB_OUTPUT"
          elif [ -f "$ROOT/index.html" ]; then
            echo "mode=root" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhum index.html ou React/package.json encontrado em $ROOT."
            echo "A estrutura atual será publicada como um placeholder até a criação da entrada do website."
            echo "mode=placeholder" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate website JavaScript
        if: steps.detect.outputs.mode == 'static' || steps.detect.outputs.mode == 'root'
        shell: bash
        run: |
          while IFS= read -r file; do
            echo "Validando $file"
            node --check "$file"
          done < <(find Front-End/WebSite -type f -name '*.js' -not -path '*/node_modules/*' | sort)


      - name: Validate inline HTML JavaScript
        if: steps.detect.outputs.mode == 'static' || steps.detect.outputs.mode == 'root'
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class InlineScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.is_javascript = False
                  self.parts = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "script":
                      return
                  attrs = dict(attrs)
                  script_type = attrs.get("type", "").lower()
                  self.in_script = True
                  self.is_javascript = not script_type or script_type in (
                      "text/javascript", "application/javascript", "module"
                  )
                  self.parts = []

              def handle_data(self, data):
                  if self.in_script and self.is_javascript:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      source = "".join(self.parts)
                      if source.strip():
                          self.scripts.append(source)
                      self.in_script = False
                      self.is_javascript = False
                      self.parts = []

          html_files = sorted(Path("Front-End/WebSite").rglob("*.html"))
          checked = 0
          with tempfile.TemporaryDirectory() as temp_dir:
              for html_file in html_files:
                  parser = InlineScriptParser()
                  parser.feed(html_file.read_text(encoding="utf-8"))
                  for index, source in enumerate(parser.scripts, 1):
                      temp_file = Path(temp_dir) / f"inline-{checked + 1}.js"
                      temp_file.write_text(source, encoding="utf-8")
                      print(f"Validando script inline {index}: {html_file}")
                      subprocess.run(["node", "--check", str(temp_file)], check=True)
                      checked += 1
          print(f"{checked} scripts inline validados.")
          PY

      - name: Setup Node.js
        if: steps.detect.outputs.mode == 'react'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Front-End/WebSite/React/package-lock.json

      - name: Install React dependencies
        if: steps.detect.outputs.mode == 'react'
        working-directory: Front-End/WebSite/React
        run: npm ci

      - name: Build React website
        if: steps.detect.outputs.mode == 'react'
        working-directory: Front-End/WebSite/React
        run: npm run build

      - name: Prepare static website
        if: steps.detect.outputs.mode == 'static'
        shell: bash
        run: |
          mkdir -p _site
          cp -a Front-End/WebSite/HTML/. _site/
          for directory in CSS JavaScript TypeScript SVG; do
            if [ -d "Front-End/WebSite/$directory" ]; then
              mkdir -p "_site/$directory"
              cp -a "Front-End/WebSite/$directory/." "_site/$directory/"
            fi
          done
          if [ -d "Front-End/WebSite/React" ]; then
            mkdir -p "_site/React"
            cp -a "Front-End/WebSite/React/." "_site/React/"
          fi

      - name: Prepare browser Node runtime assets
        if: steps.detect.outputs.mode == 'static'
        shell: bash
        run: |
          ROOT="_site/runtime/nodebrowser"
          mkdir -p "$ROOT"
          NODE_PACKAGE="$(npm pack @foisal/nodebrowser@1.3.3 --pack-destination /tmp)"
          ESBUILD_PACKAGE="$(npm pack esbuild-wasm@0.25.0 --pack-destination /tmp)"
          tar -xzf "/tmp/$NODE_PACKAGE" -C "$ROOT"
          mkdir -p "$ROOT/esbuild-wasm"
          tar -xzf "/tmp/$ESBUILD_PACKAGE" -C "$ROOT/esbuild-wasm"
          test -s "$ROOT/package/dist/index.js"
          test -s "$ROOT/package/wasm/browsernode_kernel.js"
          test -s "$ROOT/package/wasm/browsernode_kernel.wasm"
          test -s "$ROOT/esbuild-wasm/package/esm/browser.min.js"
          test -s "$ROOT/esbuild-wasm/package/esbuild.wasm"
          mkdir -p _site/node_modules/esbuild-wasm
          cp "$ROOT/esbuild-wasm/package/esbuild.wasm" _site/node_modules/esbuild-wasm/esbuild.wasm
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/foisalislambd/NodeBrowser/main/LICENSE" -o "$ROOT/package/LICENSE"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/foisalislambd/NodeBrowser/main/NOTICE" -o "$ROOT/package/NOTICE"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/bellard/quickjs/master/LICENSE" -o "$ROOT/package/QUICKJS-LICENSE"
          (cd "$ROOT" && sha256sum package/dist/index.js package/wasm/browsernode_kernel.js package/wasm/browsernode_kernel.wasm esbuild-wasm/package/esm/browser.min.js esbuild-wasm/package/esbuild.wasm > SHA256SUMS.txt)

      - name: Prepare browser Linux runtime assets
        if: steps.detect.outputs.mode == 'static'
        shell: bash
        run: |
          ROOT="_site/runtime/linux"
          mkdir -p "$ROOT/v86" "$ROOT/bios"
          curl -fsSL --retry 3 "https://cdn.jsdelivr.net/npm/v86@0.5.473/build/libv86.js" -o "$ROOT/v86/libv86.js"
          curl -fsSL --retry 3 "https://cdn.jsdelivr.net/npm/v86@0.5.473/build/v86.wasm" -o "$ROOT/v86/v86.wasm"
          curl -fsSL --retry 3 "https://copy.sh/v86/bios/seabios.bin" -o "$ROOT/bios/seabios.bin"
          curl -fsSL --retry 3 "https://copy.sh/v86/bios/vgabios.bin" -o "$ROOT/bios/vgabios.bin"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/copy/v86/master/LICENSE" -o "$ROOT/v86/LICENSE"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/copy/v86/master/LICENSE.MIT" -o "$ROOT/v86/LICENSE.MIT"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/copy/v86/master/bios/COPYING.LESSER" -o "$ROOT/bios/COPYING.LESSER"
          test -s "$ROOT/v86/libv86.js"
          test -s "$ROOT/v86/v86.wasm"
          test -s "$ROOT/bios/seabios.bin"
          test -s "$ROOT/bios/vgabios.bin"
          test -s "$ROOT/v86/LICENSE"
          test -s "$ROOT/v86/LICENSE.MIT"
          test -s "$ROOT/bios/COPYING.LESSER"
          (cd "$ROOT" && sha256sum v86/libv86.js v86/v86.wasm bios/seabios.bin bios/vgabios.bin v86/LICENSE v86/LICENSE.MIT bios/COPYING.LESSER > SHA256SUMS.txt)

      - name: Validate browser Linux runtime assets
        if: steps.detect.outputs.mode == 'static'
        shell: bash
        run: |
          ROOT="_site/runtime/linux"
          test -s "$ROOT/v86/libv86.js"
          test -s "$ROOT/v86/v86.wasm"
          test -s "$ROOT/bios/seabios.bin"
          test -s "$ROOT/bios/vgabios.bin"
          (cd "$ROOT" && sha256sum --check SHA256SUMS.txt)

      - name: Prepare root website
        if: steps.detect.outputs.mode == 'root'
        run: |
          mkdir -p _site
          cp -a Front-End/WebSite/. _site/
          rm -rf _site/React/node_modules _site/React/.git

      - name: Prepare React artifact
        if: steps.detect.outputs.mode == 'react'
        shell: bash
        run: |
          mkdir -p _site
          if [ -d "Front-End/WebSite/React/dist" ]; then
            cp -a Front-End/WebSite/React/dist/. _site/
          elif [ -d "Front-End/WebSite/React/build" ]; then
            cp -a Front-End/WebSite/React/build/. _site/
          else
            echo "Build React não gerou dist/ nem build/."
            exit 1
          fi

      - name: Prepare initial placeholder
        if: steps.detect.outputs.mode == 'placeholder'
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Aurora IDE</title>
            </head>
            <body>
              <main>
                <h1>Aurora IDE</h1>
                <p>O website está em construção.</p>
              </main>
            </body>
          </html>
          HTML

      - name: Validate SEO assets
        if: steps.detect.outputs.mode == 'static'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json
          import re
          import xml.etree.ElementTree as ET

          root = Path("_site")
          required = [
              "robots.txt", "sitemap.xml", "llms.txt", "llms-full.txt",
              "favicon.svg", "og-image.svg", "site.webmanifest", "CNAME",
              "sobre.html", "recursos.html", "404.html", "CSS/seo.css"
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit("Arquivos SEO ausentes: " + ", ".join(missing))

          manifest = json.loads((root / "site.webmanifest").read_text(encoding="utf-8"))
          if manifest.get("name") != "Aurora EDS":
              raise SystemExit("Manifesto inválido: nome inesperado.")

          if (root / "CNAME").read_text(encoding="utf-8").strip() != "aurora.korczaktech.com.br":
              raise SystemExit("CNAME não corresponde ao domínio personalizado.")

          sitemap = ET.parse(root / "sitemap.xml").getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text for node in sitemap.findall("sm:url/sm:loc", ns)]
          expected = {
              "https://aurora.korczaktech.com.br/index.html",
              "https://aurora.korczaktech.com.br/sobre.html",
              "https://aurora.korczaktech.com.br/recursos.html",
              "https://aurora.korczaktech.com.br/planos.html",
          }
          if set(urls) != expected or len(urls) != len(expected):
              raise SystemExit("Sitemap contém URLs inesperadas ou ausentes: " + repr(urls))

          robots = (root / "robots.txt").read_text(encoding="utf-8")
          if "https://aurora.korczaktech.com.br/sitemap.xml" not in robots:
              raise SystemExit("robots.txt não referencia o sitemap publicado.")

          canonical_expected = {
              "index.html": "https://aurora.korczaktech.com.br/index.html",
              "sobre.html": "https://aurora.korczaktech.com.br/sobre.html",
              "recursos.html": "https://aurora.korczaktech.com.br/recursos.html",
              "planos.html": "https://aurora.korczaktech.com.br/planos.html",
          }
          for filename, canonical in canonical_expected.items():
              html = (root / filename).read_text(encoding="utf-8")
              if not re.search(r"<title>[^<]+</title>", html, re.I):
                  raise SystemExit(f"{filename}: title ausente.")
              if not re.search(r'<meta name="description" content="[^"]+"', html, re.I):
                  raise SystemExit(f"{filename}: meta description ausente.")
              match = re.search(r'<link rel="canonical" href="([^"]+)"', html, re.I)
              if not match or match.group(1) != canonical:
                  raise SystemExit(f"{filename}: canonical incorreto.")
              blocks = re.findall(r'<script type="application/ld\+json">\s*(.*?)\s*</script>', html, re.S | re.I)
              if not blocks:
                  raise SystemExit(f"{filename}: JSON-LD ausente.")
              for block in blocks:
                  json.loads(block)

          for filename in ["editor.html", "entrar.html", "criar-conta.html"]:
              html = (root / filename).read_text(encoding="utf-8")
              if not re.search(r'<meta name="robots" content="noindex,follow"', html, re.I):
                  raise SystemExit(f"{filename}: deveria estar marcado noindex,follow.")

          profile = (root / "perfil.html").read_text(encoding="utf-8")
          if not re.search(r'<meta name="robots" content="noindex,nofollow"', profile, re.I):
              raise SystemExit("perfil.html: deveria permanecer privado com noindex,nofollow.")
          noindex_pages = ["editor.html", "entrar.html", "criar-conta.html", "perfil.html"]
          for filename in noindex_pages:
              if any(filename in url for url in urls):
                  raise SystemExit(f"{filename}: página privada/noindex incluída no sitemap.")

          print("SEO validado: sitemap, robots, manifesto, metadados, JSON-LD e noindex.")
          PY

      - name: Detect terminal runtime changes
        id: terminal-smoke
        if: steps.detect.outputs.mode == 'static'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" | grep -Eq '^(Front-End/WebSite/JavaScript/(terminal-linux-runtime.js|terminal-linux-project-bridge.js|terminal-git.js|terminal-node-runtime.js|project-manager.js|tests/linux-runtime-browser-smoke.cjs))$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Python runtime changes
        id: python-smoke
        if: steps.detect.outputs.mode == 'static'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" | grep -Eq '^(Front-End/WebSite/JavaScript/(terminal.js|terminal-python-runtime.js|tests/python-runtime-browser-smoke.cjs|tests/python-runtime-smoke.html))$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Linux terminal in a real browser
        if: steps.detect.outputs.mode == 'static' && steps.terminal-smoke.outputs.run == 'true'
        shell: bash
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
          cat > _site/linux-runtime-smoke.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
            <title>Aurora Linux Runtime Smoke Test</title>
            <style>html,body,#terminal{width:100%;height:100%;margin:0;background:#050a0b}#terminal{padding:8px;box-sizing:border-box}</style>
            <script type="importmap">
              {"imports":{"esbuild-wasm":"/runtime/nodebrowser/esbuild-wasm/package/esm/browser.min.js"}}
            </script>
            <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
            <script src="/JavaScript/terminal-linux-project-bridge.js"></script>
            <script src="/JavaScript/terminal-linux-runtime.js"></script>
            <script src="/JavaScript/terminal-git.js"></script>
            <script src="/JavaScript/terminal-node-runtime.js"></script>
            <script src="/JavaScript/terminal-python-runtime.js"></script>
          </head>
          <body>
            <div id="terminal"></div>
            <script>
              function smokeDirectory(name) {
                const children = new Map();
                return {
                  name, kind: "directory",
                  async queryPermission() { return "granted"; },
                  async *entries() { for (const item of children) yield item; },
                  async getDirectoryHandle(childName, options = {}) {
                    let item = children.get(childName);
                    if (!item && options.create) { item = smokeDirectory(childName); children.set(childName, item); }
                    if (!item || item.kind !== "directory") { const error = new Error("Directory not found"); error.name = "NotFoundError"; throw error; }
                    return item;
                  },
                  async getFileHandle(childName, options = {}) {
                    let item = children.get(childName);
                    if (!item && options.create) {
                      let bytes = new Uint8Array();
                      item = {
                        name: childName, kind: "file",
                        async getFile() { const copy = bytes.slice(); return { size: copy.length, arrayBuffer: async () => copy.buffer, text: async () => new TextDecoder().decode(copy) }; },
                        async createWritable() { return { async write(value) { bytes = typeof value === "string" ? new TextEncoder().encode(value) : value instanceof ArrayBuffer ? new Uint8Array(value) : new Uint8Array(value); }, async close() {} }; },
                        get bytes() { return bytes.slice(); }
                      };
                      children.set(childName, item);
                    }
                    if (!item || item.kind !== "file") { const error = new Error("File not found"); error.name = "NotFoundError"; throw error; }
                    return item;
                  },
                  addFile(childName, text) {
                    let bytes = new TextEncoder().encode(text);
                    children.set(childName, {
                      name: childName, kind: "file",
                      async getFile() { const copy = bytes.slice(); return { size: copy.length, arrayBuffer: async () => copy.buffer, text: async () => new TextDecoder().decode(copy) }; },
                      async createWritable() { return { async write(value) { bytes = typeof value === "string" ? new TextEncoder().encode(value) : value instanceof ArrayBuffer ? new Uint8Array(value) : new Uint8Array(value); }, async close() {} }; },
                      get bytes() { return bytes.slice(); }
                    });
                  }
                };
              }
              window.smokeProjectHandle = smokeDirectory("aurora-smoke");
              window.smokeProjectHandle.addFile("README.md", "Aurora Linux workspace bridge smoke test");
              window.addEventListener("load", async () => {
                window.smokeRuntime = new window.AuroraLinuxRuntime({ memorySize: 64 * 1024 * 1024 });
                try {
                  await window.smokeRuntime.start({
                    consoleContainer: document.getElementById("terminal"),
                    xtermLib: window.Terminal,
                    projectHandle: window.smokeProjectHandle
                  });
                  const gitContext = { rootHandle: window.smokeProjectHandle, cwd: "", environment: {} };
                  await window.AuroraGit.run(["init"], gitContext);
                  await window.AuroraGit.run(["config", "user.name", "Aurora Smoke"], gitContext);
                  await window.AuroraGit.run(["config", "user.email", "smoke@aurora.invalid"], gitContext);
                  await window.AuroraGit.run(["add", "-A"], gitContext);
                  await window.AuroraGit.run(["commit", "-m", "browser Git smoke test"], gitContext);
                  const gitStatus = await window.AuroraGit.run(["status"], gitContext);
                  document.body.dataset.gitSmoke = gitStatus.includes("Árvore de trabalho limpa.") ? "passed" : gitStatus;
                  try {
                    window.smokeProjectHandle.addFile("node-smoke.js", "console.log('AURORA_NODE_READY:' + typeof require('fs').readFileSync);");
                    window.smokeProjectHandle.addFile("package.json", JSON.stringify({ name: "aurora-smoke", version: "1.0.0" }));
                    window.smokeProjectHandle.addFile("node-smoke.ts", "const answer: number = 42;\nconsole.log(answer);\n");
                    const nodeSession = { cwd: "", environment: {}, nodeRuntime: null, nodeProcess: null };
                    const nodeResult = await window.AuroraNodeRuntime.run(nodeSession, "node", ["node-smoke.js"], {
                      rootHandle: window.smokeProjectHandle, cwd: "", environment: {}
                    });
                    document.body.dataset.nodeSmoke = nodeResult.code === 0 && nodeResult.output.includes("AURORA_NODE_READY:function") ? "passed" : "failed: " + nodeResult.output + " (exit " + nodeResult.code + ")";
                    if (nodeResult.code === 0) {
                      try {
                      let installTrace = "";
                      document.body.dataset.npmStatus = "installing";
                      const installResult = await window.AuroraNodeRuntime.run(nodeSession, "npm", ["install", "ms@2.1.3"], {
                        rootHandle: window.smokeProjectHandle, cwd: "", environment: {}, debug: true,
                        onOutput: chunk => { installTrace += chunk; document.body.dataset.npmTrace = installTrace.slice(-2000); }
                      });
                      document.body.dataset.npmStatus = "installed:" + installResult.code;
                      if (installResult.code === 0) {
                        window.smokeProjectHandle.addFile("npm-smoke.js", "console.log('AURORA_NPM_READY:' + require('ms')('2 days'));");
                        const npmRunResult = await window.AuroraNodeRuntime.run(nodeSession, "node", ["npm-smoke.js"], {
                          rootHandle: window.smokeProjectHandle, cwd: "", environment: {}
                        });
                        if (npmRunResult.code !== 0 || !npmRunResult.output.includes("AURORA_NPM_READY:172800000")) {
                          document.body.dataset.npmSmoke = "failed: trace=" + installTrace + " install=" + installResult.code + " npmRun=" + npmRunResult.code + " npmOutput=" + npmRunResult.output;
                        } else {
                          const compileResult = await window.AuroraNodeRuntime.run(nodeSession, "esbuild", ["node-smoke.ts", "--outfile=dist/node-smoke.js", "--format=esm"], {
                            rootHandle: window.smokeProjectHandle, cwd: "", environment: {}
                          });
                          let compiled = "";
                          try { compiled = await (await (await window.smokeProjectHandle.getDirectoryHandle("dist")).getFileHandle("node-smoke.js")).getFile().then(file => file.text()); } catch (_) {}
                          document.body.dataset.npmSmoke = compileResult.code === 0 && compiled.includes("42") ? "passed" : "failed: compile=" + compileResult.code + " output=" + compileResult.output + " compiled=" + compiled;
                        }
                      } else {
                        document.body.dataset.npmSmoke = "failed: npm install exit " + installResult.code + " " + installResult.output;
                      }
                      } catch (npmError) {
                        document.body.dataset.npmStatus = "error";
                        document.body.dataset.npmSmoke = "failed: " + (npmError?.stack || npmError?.message || String(npmError));
                      }
                    } else {
                      document.body.dataset.npmSmoke = "skipped: Node smoke failed";
                    }
                    window.AuroraNodeRuntime.dispose(nodeSession);
                    const pythonSession = { worker: null, cancelExecution: null };
                    let pythonOutput = "";
                    const pythonCode = "with open('README.md') as f:\n    print('AURORA_PYTHON_READ:' + f.read().strip())\nwith open('python-smoke.txt', 'w') as f:\n    f.write('AURORA_PYTHON_READY')";
                    const pythonResult = await window.AuroraPythonRuntime.run(pythonSession, pythonCode, {
                      rootHandle: window.smokeProjectHandle, cwd: "",
                      onOutput: chunk => { pythonOutput += chunk; }
                    });
                    let pythonFile = "";
                    try { pythonFile = await (await window.smokeProjectHandle.getFileHandle("python-smoke.txt")).getFile().then(file => file.text()); } catch (_) {}
                    document.body.dataset.pythonSmoke = pythonResult.code === 0 && pythonOutput.includes("AURORA_PYTHON_READ:Aurora Linux workspace bridge smoke test") && pythonFile === "AURORA_PYTHON_READY" && pythonResult.sync.written === 1 ? "passed" : "failed: code=" + pythonResult.code + " output=" + pythonOutput + " file=" + pythonFile + " sync=" + JSON.stringify(pythonResult.sync);
                  } catch (nodeError) {
                    document.body.dataset.nodeSmoke = "failed: " + (nodeError?.stack || nodeError?.message || String(nodeError));
                  }
                } catch (error) {
                  document.body.dataset.runtimeError = error?.stack || error?.message || String(error);
                  document.body.dataset.gitSmoke = "failed: " + (error?.message || String(error));
                }
              });
            </script>
          </body>
