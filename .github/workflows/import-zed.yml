name: Import Zed into Aurora-IDE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-zed:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Clone Zed
        run: |
          git clone --branch main --single-branch https://github.com/zed-industries/zed.git zed
      - name: Push Zed into Aurora-IDE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git -C zed remote add aurora "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git -C zed push aurora HEAD:main --force
