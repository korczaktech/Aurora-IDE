name: Validação temporária do terminal

on:
  push:
    branches: [main]
    paths:
      - "Back-End/**"
      - ".github/workflows/terminal-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust:
    name: Formatação, análise, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back-End
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Back-End
      - name: Aplicar rustfmt
        run: cargo fmt --all
      - name: Salvar formatação no repositório
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Formata implementação do terminal"
          file_pattern: "Back-End/**/*.rs"
      - name: Verificar formatação
        run: cargo fmt --all -- --check
      - name: Executar Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Executar todos os testes
        run: cargo test --workspace
      - name: Build de release
        run: cargo build --release --workspace
