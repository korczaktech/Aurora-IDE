name: Aurora Editor Validation

on:
  push:
    branches:
      - main
    paths:
      - "Front-End/WebSite/HTML/editor.html"
      - "Front-End/WebSite/CSS/editor.css"
      - "Front-End/WebSite/JavaScript/syntax-highlighting.js"
      - "Front-End/WebSite/JavaScript/editor-intelligence.js"
      - "Front-End/WebSite/JavaScript/editor-typing.js"
      - "Front-End/WebSite/JavaScript/file-icons.js"
      - "Front-End/WebSite/JavaScript/project-manager.js"
      - "Front-End/WebSite/JavaScript/terminal.js"
      - "Front-End/WebSite/JavaScript/terminal-git.js"
      - "Front-End/WebSite/JavaScript/terminal-linux-runtime.js"
      - "Front-End/WebSite/JavaScript/terminal-linux-project-bridge.js"
      - "Front-End/WebSite/JavaScript/tests/**"
      - "Front-End/WebSite/JavaScript/editor-controls.js"
      - ".github/workflows/editor-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-editor:
    name: Validate syntax highlighting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check Front-End/WebSite/JavaScript/syntax-highlighting.js
          node --check Front-End/WebSite/JavaScript/editor-intelligence.js
          node --check Front-End/WebSite/JavaScript/editor-typing.js
          node --check Front-End/WebSite/JavaScript/file-icons.js
          node --check Front-End/WebSite/JavaScript/project-manager.js
          node --check Front-End/WebSite/JavaScript/terminal.js
          node --check Front-End/WebSite/JavaScript/terminal-git.js
          node --check Front-End/WebSite/JavaScript/terminal-linux-runtime.js
          node --check Front-End/WebSite/JavaScript/terminal-linux-project-bridge.js
          node --check Front-End/WebSite/JavaScript/editor-controls.js

      - name: Run editor tests
        run: node --test Front-End/WebSite/JavaScript/tests/*.test.cjs
